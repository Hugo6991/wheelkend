<title>上海週末目的地轉盤 v2</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --ink: #29211a;
    --ink-soft: #6b5d4c;
    --paper: #f3e9d5;
    --paper-hi: #fbf4e2;
    --verm: #c2402c;
    --verm-deep: #9e3221;
    --teal: #20565a;
    --ochre: #d6992f;
    --gold: #e4b84c;
    --line: rgba(41, 33, 26, .16);
  }

  * { box-sizing: border-box; }

  html { overflow-x: hidden; overflow-x: clip; }

  body {
    margin: 0;
    overflow-x: hidden;
    overflow-x: clip; /* decorative bleed (rays / stamps) must never cause page scroll */
    background-color: var(--paper);
    background-image: radial-gradient(rgba(41, 33, 26, .055) 1px, transparent 1.3px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 56px) 20px 72px;
    overflow-x: clip; /* second fence: clip the rays' rotated bleed right here */
  }

  /* ---------- header ---------- */
  header { text-align: center; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .34em;
    text-indent: .34em;
    color: var(--verm);
    text-transform: uppercase;
  }
  .eyebrow::before, .eyebrow::after { content: "★"; font-size: 9px; letter-spacing: 0; text-indent: 0; }

  h1 {
    position: relative;
    display: inline-block;
    margin: 10px 0 0;
    font-family: 'Noto Serif TC', 'Songti TC', serif;
    font-weight: 900;
    font-size: clamp(38px, 9vw, 62px);
    line-height: 1.14;
    letter-spacing: .04em;
  }
  h1 .h1-verm { color: var(--verm); }
  .v2-tag {
    position: absolute;
    top: -6px;
    right: -44px;
    transform: rotate(8deg);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    background: var(--gold);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 1px 8px;
    box-shadow: 2px 2px 0 rgba(41, 33, 26, .8);
  }
  @media (max-width: 560px) { .v2-tag { right: -34px; top: -14px; } }

  .lede {
    margin: 14px auto 0;
    max-width: 34em;
    font-size: 15px;
    color: var(--ink-soft);
  }

  .orn {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 300px;
    margin: 22px auto 0;
    color: var(--verm);
    font-size: 13px;
  }
  .orn::before, .orn::after { content: ""; flex: 1; border-top: 1.5px solid var(--line); }

  /* ---------- wheel stage ---------- */
  .stage-wrap {
    position: relative;
    width: min(88vw, 500px);
    margin: 38px auto 0;
  }

  .side-tag {
    position: absolute;
    top: 34px;
    writing-mode: vertical-rl;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: .42em;
    color: var(--verm);
    background: var(--paper-hi);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 16px 7px;
    box-shadow: 4px 4px 0 rgba(41, 33, 26, .14);
  }
  .side-tag.l { left: -96px; transform: rotate(-2deg); }
  .side-tag.r { right: -96px; transform: rotate(2deg); }
  @media (max-width: 1020px) { .side-tag { display: none; } }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }

  .rays {
    position: absolute;
    inset: -13%;
    border-radius: 50%;
    background: repeating-conic-gradient(from -4deg,
      rgba(194, 64, 44, .10) 0deg 5.5deg,
      transparent 5.5deg 25.7deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 60%, rgba(0,0,0,.5) 78%, transparent 96%);
    mask-image: radial-gradient(closest-side, #000 60%, rgba(0,0,0,.5) 78%, transparent 96%);
    animation: rays-turn 80s linear infinite;
    pointer-events: none;
  }
  @keyframes rays-turn { to { transform: rotate(360deg); } }

  .rim, .hub, .cta, .stage {
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .rim {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--ink);
    padding: clamp(11px, 2.8vw, 15px);
    box-shadow:
      0 22px 44px -20px rgba(41, 33, 26, .55),
      inset 0 0 0 2.5px rgba(228, 184, 76, .28);
    cursor: pointer;
  }

  .wheel-window {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--paper-hi);
  }

  .stud {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 1px rgba(41, 33, 26, .55), 0 1px 1px rgba(0, 0, 0, .35);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
  }

  .pointer {
    position: absolute;
    top: -13px;
    left: 50%;
    width: clamp(36px, 10%, 46px);
    margin-left: calc(clamp(36px, 10%, 46px) / -2);
    z-index: 6;
    transform-origin: 50% 14%;
    filter: drop-shadow(0 3px 3px rgba(41, 33, 26, .3));
    pointer-events: none;
  }
  .pointer svg { display: block; width: 100%; height: auto; }
  .pointer.tick { animation: ptick .11s ease-out; }
  @keyframes ptick {
    0% { transform: rotate(0deg); }
    38% { transform: rotate(-13deg); }
    100% { transform: rotate(0deg); }
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background:
      radial-gradient(circle at 50% 34%, #fffaf0 0%, var(--paper-hi) 62%);
    box-shadow: 0 4px 0 rgba(41, 33, 26, .9), inset 0 0 0 4px rgba(194, 64, 44, .14);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .hub:hover { transform: translate(-50%, calc(-50% - 2px)); box-shadow: 0 6px 0 rgba(41, 33, 26, .9), inset 0 0 0 4px rgba(194, 64, 44, .14); }
  .hub:active, .hub[disabled] { transform: translate(-50%, calc(-50% + 2px)); box-shadow: 0 1px 0 rgba(41, 33, 26, .9), inset 0 0 0 4px rgba(194, 64, 44, .14); }
  .hub[disabled] { cursor: default; }
  .hub .zh {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(26px, 7.4vw, 40px);
    line-height: 1.05;
    color: var(--verm);
  }
  .hub .en {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .32em;
    text-indent: .32em;
    color: var(--ink-soft);
  }

  /* ---------- CTA ---------- */
  .cta-row { text-align: center; margin-top: 30px; }
  .cta {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--paper-hi);
    background: var(--verm);
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 13px 44px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .14s ease, box-shadow .14s ease, background .2s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); background: var(--verm-deep); }
  .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .cta[disabled] {
    background: #b3a68d;
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
    cursor: default;
  }

  /* ---------- result ---------- */
  .result {
    position: relative;
    margin: 30px auto 0;
    max-width: 520px;
    background: var(--paper-hi);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 20px 18px 18px;
    text-align: center;
    box-shadow: 7px 7px 0 rgba(41, 33, 26, .09);
  }
  .result::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1.5px dashed rgba(194, 64, 44, .38);
    border-radius: 10px;
    pointer-events: none;
  }

  .chip {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .28em;
    text-indent: .28em;
    color: var(--ink-soft);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 3px 14px;
    background: rgba(255, 255, 255, .35);
  }
  .chip.hot { color: var(--verm); border-color: rgba(194, 64, 44, .5); }

  .verdict {
    margin: 10px 0 0;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 26px);
    line-height: 1.3;
    letter-spacing: .03em;
  }
  .verdict .win { color: var(--verm); border-bottom: 3px solid var(--gold); padding: 0 2px; }

  .timepill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    padding: 3px 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .timepill .tp-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .24em;
    text-indent: .24em;
    color: var(--paper-hi);
    background: var(--teal);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .live {
    margin-top: 14px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .live b { color: var(--ink); font-weight: 700; }

  .whisper { margin: 12px 0 0; font-size: 13px; color: var(--ink-soft); }

  .stamp {
    position: absolute;
    top: -18px;
    right: 14px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 3px solid var(--verm);
    box-shadow: inset 0 0 0 2px var(--paper-hi), inset 0 0 0 3.5px var(--verm);
    color: var(--verm);
    display: none;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: .14em;
    text-indent: .14em;
    transform: rotate(-12deg);
    background: rgba(251, 244, 226, .82);
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 2;
  }
  .stamp.on { display: flex; animation: slam .4s cubic-bezier(.2, 1.7, .4, 1) both; }
  @keyframes slam {
    0% { transform: rotate(-30deg) scale(2.6); opacity: 0; }
    62% { opacity: 1; }
    100% { transform: rotate(-12deg) scale(1); opacity: 1; }
  }

  /* ---------- city card (compact: small photo left, intro right, keywords) ---------- */
  .card-cols {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    text-align: left;
    align-items: flex-start;
  }
  .photo-wrap {
    position: relative;
    flex: none;
    width: 172px;
    aspect-ratio: 4 / 3;
    border: 2px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper);
  }
  .photo-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: sepia(.13) saturate(.94) contrast(1.02);
  }
  .photo-cap {
    position: absolute;
    left: 6px;
    bottom: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--paper-hi);
    background: rgba(41, 33, 26, .78);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .photo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--ink-soft);
  }
  .intro {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 13px;
    line-height: 1.75;
    color: var(--ink);
  }
  @media (max-width: 540px) {
    .card-cols { flex-direction: column; }
    .photo-wrap { width: 100%; aspect-ratio: 16 / 9; max-height: 170px; }
  }

  .kw-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .kw {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink);
    border: 1.5px solid rgba(41, 33, 26, .32);
    border-radius: 999px;
    background: rgba(255, 255, 255, .45);
    padding: 2px 10px;
    white-space: nowrap;
  }
  .kw::before { content: "# "; color: var(--verm); font-weight: 700; }

  /* ---------- city picker ---------- */
  .city-pick {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--ink-soft);
  }
  .city-pick select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-hi);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(41, 33, 26, .85);
  }

  /* ---------- map ---------- */
  .map-sec { margin-top: 46px; }
  #bigmap {
    height: 340px;
    margin-top: 18px;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    box-shadow: 7px 7px 0 rgba(41, 33, 26, .09);
    background: var(--paper);
    filter: sepia(.14) saturate(.92);
    z-index: 0;
  }
  @media (max-width: 540px) { #bigmap { height: 280px; } }
  .map-sec .m-note {
    margin: 8px 2px 0;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--ink-soft);
    text-align: center;
  }
  .map-tip {
    background: var(--ink);
    color: var(--paper-hi);
    border: none;
    border-radius: 999px;
    padding: 1px 8px;
    font-weight: 700;
    font-size: 11px;
  }
  .map-tip::before { display: none; }

  /* ---------- list ---------- */
  .list-sec { margin-top: 46px; }
  .list-head {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: .18em;
  }
  .list-head .cnt {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--verm);
    border: 1.5px solid rgba(194, 64, 44, .5);
    border-radius: 999px;
    padding: 1px 10px;
    white-space: nowrap;
  }
  .list-head::before, .list-head::after { content: ""; flex: 1; border-top: 1.5px solid var(--line); }
  .list-head::before { max-width: 28px; }

  ul.dests {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 6px 26px;
  }
  ul.dests li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1.5px solid transparent;
    transition: background .25s ease, border-color .25s ease;
  }
  ul.dests .dot {
    align-self: center;
    flex: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
  }
  ul.dests .d-name { font-weight: 700; font-size: 15px; white-space: nowrap; }
  ul.dests .leader { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
  ul.dests .d-time { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  ul.dests li.is-hit {
    background: rgba(194, 64, 44, .09);
    border-color: rgba(194, 64, 44, .55);
  }
  ul.dests li.is-hit .d-name { color: var(--verm); }
  ul.dests li.is-hit .d-time { color: var(--verm-deep); font-weight: 700; }

  /* ---------- footer ---------- */
  footer {
    margin-top: 52px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: .05em;
  }
  footer .f-orn { color: var(--verm); font-size: 11px; margin-bottom: 6px; }
  footer a { color: inherit; }
  .credits { margin-top: 14px; }
  .credits summary { cursor: pointer; font-size: 11px; color: var(--ink-soft); }
  .credits-body {
    margin: 8px auto 0;
    max-width: 560px;
    font-size: 10.5px;
    line-height: 1.9;
    color: var(--ink-soft);
    text-align: left;
  }

  /* entrance animation removed: fill-mode animations can leave content
     unpainted in embedded viewers (artifact iframe / preview pane) */

  @media (prefers-reduced-motion: reduce) {
    .rays { animation: none; }
    .stamp.on { animation: none; }
    .cta, .hub { transition: none; }
  }
</style>

<div class="page">
  <header class="rev rev-1">
    <span class="eyebrow" id="eyebrow">滬上出發・週末限定</span><br>
    <h1>週末目的地<span class="h1-verm">轉盤</span><span class="v2-tag">V2</span></h1>
    <p class="lede" id="lede">十四個目的地，最遠車程三小時<br>點一下轉盤，去哪交給命運</p>
    <div class="city-pick">出發城市<select id="citySel" aria-label="選擇出發城市"></select></div>
    <div class="orn">✦</div>
  </header>

  <div class="stage-wrap rev rev-2">
    <span class="side-tag l" id="sideL" aria-hidden="true">說走就走</span>
    <span class="side-tag r" id="sideR" aria-hidden="true">滬上出發</span>
    <div class="stage">
      <div class="rays" aria-hidden="true"></div>
      <div class="rim" id="rim" title="點一下，轉起來">
        <div class="wheel-window" id="wheelWindow" aria-label="目的地轉盤"></div>
        <button class="hub" id="hubBtn" type="button" aria-label="旋轉轉盤">
          <span class="zh">轉</span>
          <span class="en">SPIN</span>
        </button>
      </div>
      <div class="pointer" id="pointer" aria-hidden="true">
        <svg viewBox="0 0 44 58" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 56 C 8.5 34 4 24 4 15 C 4 7.5 12 2.5 22 2.5 C 32 2.5 40 7.5 40 15 C 40 24 35.5 34 22 56 Z"
                fill="#c2402c" stroke="#29211a" stroke-width="3.5" stroke-linejoin="round"/>
          <circle cx="22" cy="14.5" r="5" fill="#e4b84c" stroke="#29211a" stroke-width="2.5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="cta-row rev rev-3">
    <button class="cta" id="ctaBtn" type="button">交給命運</button>
  </div>

  <section class="result rev rev-3" aria-live="polite">
    <div class="stamp" id="stamp">出發</div>
    <div id="resultBody">
      <span class="chip">尚未開獎</span>
      <p class="verdict">這週末，去哪裡？</p>
      <p class="whisper">十四選一——點轉盤中央，或按上面的紅按鈕</p>
    </div>
  </section>

  <section class="list-sec rev rev-4">
    <div class="list-head">候選名單</div>
    <ul class="dests" id="destList"></ul>
  </section>

  <section class="map-sec rev rev-4" id="mapSec">
    <div class="list-head">目的地版圖</div>
    <div id="bigmap"></div>
    <p class="m-note">圖資 © OpenStreetMap 貢獻者・轉出結果會自動飛過去</p>
  </section>

  <footer class="rev rev-4">
    <div class="f-orn">★ ★ ★</div>
    轉盤引擎：<a href="https://github.com/CrazyTim/spin-wheel" rel="noopener">CrazyTim / spin-wheel</a> v5.0.2（MIT，原始碼已完整內嵌）<br>
    車程與景點為參考資訊，出發前請再確認班次與開放時間
    <details class="credits" id="creditsWrap">
      <summary>圖片來源與授權（Wikimedia Commons）</summary>
      <div class="credits-body" id="creditsBody"></div>
    </details>
  </footer>
</div>
